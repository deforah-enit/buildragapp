version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybridrag-backend
    ports:
      - "8000:8000"
    environment:
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o-mini
      
      # Neo4j Configuration
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    
    # Volume for .env file (optional, for development)
    volumes:
      - ./.env:/app/.env:ro
    
    # Restart policy
    restart: unless-stopped
    
    # Health check (defined in Dockerfile)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hybridrag-frontend
    ports:
      - "8501:8501"
    environment:
      # Backend API URL
      BACKEND_URL: http://backend:8000
      
      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    
    # Volume for .env file (optional, for development)
    volumes:
      - ./.env:/app/.env:ro
    
    # Depends on backend being healthy
    depends_on:
      backend:
        condition: service_healthy
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Networks (optional, for better isolation)
networks:
  default:
    name: hybridrag-network
    driver: bridge

# Volumes (optional, for persistent data if needed)
volumes:
  # Add here if you want to persist FAISS indexes or other data
  # faiss-data:
  #   driver: local